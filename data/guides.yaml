    label: Choose a flavor direction
  - url: /brewing-calculator/
    label: Calculate leaf for the water you will use
  - url: /guide/how-to-taste-tea/
    label: Describe the cup and compare your next infusion
  - url: /guide/how-to-store-chinese-tea/
    label: Store the remaining leaves
- id: caffeine-in-chinese-tea
  title: Caffeine in Chinese Tea
  title_zh: null
  description: Understand why tea type cannot tell you a caffeine dose, what our reference labels mean, and what information to seek when caffeine matters.
  sections:
  - heading: Tea Type Does Not Establish a Dose
    body: Research measuring commercial white, green, and black teas found overlapping caffeine results rather than a dependable ranking by tea color. Those products were not the teas in our dataset. A category, roast, pale cup, or smooth flavor cannot establish the amount in your particular serving.
  - heading: What Changes the Cup
    body: Product and preparation variables both matter. Leaf amount, water amount, infusion time, and the product itself need to be specified when comparing measurements. A published result for one product and recipe should not be presented as a universal value for a tea name.
  - heading: What Our Labels Mean
    body: The <a href="/chinese-tea-caffeine-chart/">reference chart</a> displays inherited low, moderate, and high dataset labels. They are unverified descriptors, not milligrams per cup or a tested ordering of tea varieties. We have not measured the 136 tea profiles. Use the labels to understand the dataset, not to select a tea for a medical limit or sleep concern.
  - heading: Raw and Ripe Pu'er
    body: We do not have product-specific evidence establishing that the ripe pu'er listed here is consistently lower in caffeine than the raw pu'er. Choose between them by the <a href="/guide/raw-vs-ripe-puerh/">flavor and processing differences</a>, and seek measured information for caffeine. Ripe fermentation does not make a product caffeine-free.
  - heading: A Brief Rinse Is Not a Decaffeination Method
    body: This site does not offer a validated rinse procedure for removing caffeine. Discarding a quick infusion or brewing lightly does not establish a safe dose. If you need to avoid caffeine, look for a product explicitly identified for that purpose rather than relying on a home rinse.
  - heading: When Caffeine Matters to Your Decision
    body: Check product information and serving size. The FDA notes that sensitivity varies and that decaffeinated tea still contains some caffeine. If caffeine affects your sleep or a health decision, use appropriate product information and professional guidance instead of our reference labels. For taste, the <a href="/find-your-tea/">Tea Finder</a> remains useful without pretending to measure a dose.
  faqs:
  - q: Is white tea always lower in caffeine than black tea?
    a: No reliable ordering follows from the category alone. Measurements of commercial white, green, and black teas overlap, and the product and recipe matter.
  - q: Does ripe pu'er have no caffeine?
    a: No. We do not treat ripe pu'er as caffeine-free or as a reliably low-caffeine bedtime choice.
  - q: Does this site show measured caffeine in milligrams?
    a: No. The dataset labels are unverified reference descriptors. We have not measured the caffeine in these tea profiles or in your cup.
  sources:
  - title: Chin and colleagues, Caffeine content of brewed teas
    url: https://pubmed.ncbi.nlm.nih.gov/19007524/
    scope: Measurements of commercial white, green, and black teas under several brewing conditions; not measurements of the teas in our dataset.
  - title: Astill and colleagues, Factors affecting tea infusions
    url: https://pubmed.ncbi.nlm.nih.gov/11714326/
    scope: Research on product and preparation variables; supports treating a recipe and product as important context.
  - title: FDA caffeine guidance
    url: https://www.fda.gov/consumers/consumer-updates/spilling-beans-how-much-caffeine-too-much
    scope: General caffeine information, individual sensitivity, sleep concerns, and the distinction between decaffeinated and caffeine-free.
  next_steps:
  - url: /find-your-tea/
    label: Explore teas by flavor with the Tea Finder
  - url: /brewing-calculator/
    label: Scale a starting recipe to your vessel
- id: oolong-vs-green-tea
  title: Oolong vs Green Tea
  title_zh: null
  description: Oolong and green tea are both famous Chinese teas, but they differ in oxidation, flavor, caffeine, and brewing. Learn which one suits you.
  sections:
  - heading: Oxidation Is the Main Difference
    body: Green tea is unoxidized, giving it a fresh, grassy, and sometimes nutty profile. Oolong is partially oxidized, ranging from light and floral to dark and roasted.
  - heading: Flavor Profiles
    body: Green tea tends to be brisk, vegetal, and clean. Oolong offers more complexity, with notes of orchid, cream, fruit, toast, or minerals depending on the style.
  - heading: Body and Caffeine Are Different
    body: Our flavor descriptions often place oolong in a fuller or more aromatic direction and green tea in a fresher direction. Neither body nor roast establishes a caffeine dose. Read the <a href="/guide/caffeine-in-chinese-tea/">caffeine guide</a> rather than treating category as a measured ranking.
  - heading: Brewing Approach
    body: Green tea likes cooler water around 75–85°C. Oolong can handle hotter water, often 90–100°C, and rewards gongfu brewing with many short infusions.
  faqs:
  - q: What is the difference between oolong and green tea?
    a: Green tea is unoxidized, giving a fresh, grassy, sometimes nutty profile. Oolong is partially oxidized, ranging from light and floral to dark and roasted, with a fuller body and more complexity.
  - q: Is oolong or green tea higher in caffeine?
    a: Category alone does not establish which cup contains more caffeine. The product and preparation matter; this site has not measured the dose in these teas.
  - q: Which is healthier, oolong or green tea?
    a: This guide compares flavor and preparation, not clinical outcomes. It cannot rank the two categories by a health benefit.
- id: puerh-vs-black-tea
  title: 'Pu''er vs Black Tea: Differences in Taste and Brewing'
  title_zh: null
  description: Is pu'er the same as black tea? Compare raw and ripe pu'er with Chinese black tea, choose a flavor direction, and start a repeatable brew.
  sections:
  - heading: Is Pu'er a Black Tea?
    body: 'Pu''er and Chinese black tea are different tea styles. English black tea is usually called <em>hong cha</em>, or red tea, in Chinese. A dark-colored infusion does not make every tea a black tea. First identify the product rather than judging only the color of its cup: a bag marked sheng is raw pu''er, while shou or shu identifies ripe pu''er.'
  - heading: Separate Raw and Ripe Before Comparing
    body: The Yuxi market regulator distinguishes raw pu'er made without the wet-piling step from ripe pu'er made with that step. Its consumer notice also cautions against unsupported origin, age, and processing claims. A seller should say which style a product is, how it was stored, and what production information is available. A compressed cake is a format, not proof of age or quality. Read the <a href="/guide/raw-vs-ripe-puerh/">raw versus ripe guide</a> before assuming all pu'er will taste similar.
  - heading: Choose by the Flavor You Want
    body: 'Use our reference descriptions as starting directions: <a href="/tea/dianhong-gongfu/">Dianhong black tea</a> offers a malty direction; <a href="/tea/menghai-shou-puerh/">ripe pu''er</a> offers an earthier direction; <a href="/tea/yiwu-sheng-puerh/">raw pu''er</a> explores a different, sometimes brisker profile. These are not results of a side-by-side tasting we conducted. Products, storage, and preparation differ. Buy small samples when possible and compare the actual cups.'
  - heading: Start with a Repeatable Recipe
    body: 'Use your seller''s instructions when available. Otherwise, use the <a href="/brewing-calculator/">calculator</a>: select black or pu''er, choose Western or gongfu style, and enter the water you actually pour. The results are house starting recipes, not universal optima. For a fair taste comparison, note the dry-leaf amount, water volume, temperature, and infusion time for each cup rather than making one arbitrarily stronger.'
  - heading: Adjust and Compare the Next Infusion
    body: If one cup is too bitter or drying, shorten its next infusion before changing several variables. If it is weak, try a slightly longer steep. Compare aroma, mouthfeel, aftertaste, and whether you enjoy the result. Continue infusions only while they have useful flavor. See the <a href="/brewing/black/">black tea</a> and <a href="/brewing/puerh/">pu'er brewing guides</a> for category starting points.
  - heading: Keep Caffeine and Health Claims Out of the Taste Ranking
    body: Neither dark color, fermentation wording, nor a mellow flavor establishes the caffeine dose in your cup. We do not have product-specific measurements supporting a dependable black-versus-pu'er caffeine ranking. Choose by the flavor and preparation you want; consult the <a href="/guide/caffeine-in-chinese-tea/">caffeine evidence guide</a> if dose matters. This comparison does not establish digestive, weight-loss, or other clinical benefits.
  faqs:
  - q: Is pu'er the same as black tea?
    a: No. Identify the product and distinguish raw (sheng) from ripe (shou or shu) pu'er. Infusion color alone does not identify a tea style.
  - q: Which should I try first?
    a: Try a small black-tea sample for a malty direction or ripe pu'er for an earthier direction. Products vary; judge the cup you brew, not the category's reputation.
  - q: Does pu'er have less caffeine than black tea?
    a: This site has no product-specific measurements establishing that ranking. Product and preparation matter; a gentle taste is not evidence of a low dose.
  sources:
  - &id001
    title: 'Yuxi market regulator: buying and identifying pu''er (Chinese)'
    url: https://www.yuxi.gov.cn/yxszfxxgk/spaq/20241126/1569925.html
    scope: Raw versus ripe processing and checks for misleading origin, age, and product claims. This consumer notice does not validate clinical benefits or the individual teas in our dataset.
  next_steps:
