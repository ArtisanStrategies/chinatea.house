- id: chinese-tea-for-beginners
  title: Chinese Tea for Beginners
  title_zh: null
  description: Choose a first Chinese tea by flavor, brew it in a mug, and adjust a bitter or weak cup. Start with equipment you already have.
  sections:
  - heading: Choose One Flavor Direction
    body: Start with a flavor you already enjoy. For fresh or nutty notes, explore <a href="/tea/xi-hu-longjing/">Longjing green tea</a>. For floral aromas, compare <a href="/tea/tie-guan-yin/">Tie Guan Yin oolong</a> and <a href="/tea/jasmine-yin-hao/">jasmine tea</a>. For a fuller, malty direction, explore <a href="/tea/dianhong-gongfu/">Dianhong black tea</a>. These are starting choices from our reference descriptions, not a ranking of products we have tasted. Choose one small sample before buying a large collection.
  - heading: Check the Product Before You Buy
    body: A tea name describes a style; it does not guarantee the quality of every bag sold under that name. Look for a seller who identifies the tea, its origin, available harvest or production information, and preparation instructions. Ask for a sample size and read the total price including delivery. Favor clear information over an extravagant story. We do not sell tea or endorse a particular seller here.
  - heading: Begin with a Mug and a Strainer
    body: You can start with a mug, a roomy infuser or separate strainer, a kettle, and a timer. A small scale makes recipes easier to repeat, but you do not need a full ceremonial set. Give the leaves room to open and remove or strain them when the infusion is ready. Leaving leaves in the cup keeps extraction going and makes the result harder to control.
  - heading: Make Your First Cup
    body: Use the instructions on your particular tea when available. Otherwise, choose its category and Western style in the <a href="/brewing-calculator/">brewing calculator</a>, enter the amount of water you will actually pour, and use the result as a house starting recipe. Measure the water, add the suggested leaf, set a timer, and separate the liquid from the leaves at the end. Read the <a href="/brewing/">category brewing guide</a> for the limits of a general recipe.
  - heading: Adjust One Thing at a Time
    body: Taste before adding milk or sugar if you want to learn the tea itself. If the cup is unpleasantly bitter or drying, first shorten the next steep while keeping the leaf and water amounts the same. If it is weak, extend the steep a little before changing the leaf amount. For green tea, cooler water is another adjustment to explore. Change one variable, note the result, and repeat. Your own observation is more useful than chasing a universal perfect cup.
  - heading: Try Another Infusion
    body: If the leaves still have useful flavor, pour fresh water over them and try again. Later infusions may need a different steep time. Stop when the result is no longer enjoyable; a promised number of steeps is not a requirement. You can learn how a tea changes without investing in extra teaware.
  - heading: Learn the Categories When They Help
    body: The six traditional processing families are green, white, yellow, oolong, black, and dark tea. This site uses eight browsing sections by listing pu'er separately and adding scented tea. That navigation choice explains why you see both six and eight in tea guides. Use the <a href="/guide/types-of-chinese-tea/">types guide</a> when you want to understand processing, rather than memorizing every region before making a cup.
  - heading: Keep Flavor and Caffeine Separate
    body: A gentle flavor does not establish a low-caffeine drink. Our tea dataset has reference labels, not laboratory measurements of your product or cup. If caffeine matters to your choice, read the <a href="/guide/caffeine-in-chinese-tea/">caffeine guide</a> and seek product-specific information. The Tea Finder helps you explore flavors; it cannot determine a caffeine dose.
  - heading: Move to Gongfu Brewing When You Want More Control
    body: Gongfu brewing uses a smaller vessel and shorter repeated infusions. Try it when you want to follow changes across a session, not because a mug is an incorrect way to drink tea. The <a href="/guide/gongfu-tea-setup/">gongfu setup guide</a> explains the equipment, and the calculator lets you scale its house recipes.
  faqs:
  - q: Which Chinese tea should I try first?
    a: 'Choose by flavor: Longjing for fresh or nutty notes, Tie Guan Yin or jasmine for floral aromas, or Dianhong for a fuller malty direction. Start with a small sample and follow that product''s brewing instructions.'
  - q: Do I need a gaiwan to start?
    a: No. A mug with a roomy infuser or strainer is enough. Separate the leaves from the liquid when the steep is finished so the recipe is repeatable.
  - q: Why is my tea bitter?
    a: First try a shorter steep with the same leaf and water amounts. If needed, adjust temperature or leaf amount in a later cup. Change one variable at a time.
  sources:
  - title: Mei Leaf, How much tea for gongfu brewing
    url: https://www.youtube.com/watch?v=ZxjEoRt3zwg
    scope: A practitioner demonstration of gongfu leaf ratios as starting points; not validation of every recipe or tea in this site.
  next_steps:
