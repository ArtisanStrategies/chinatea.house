name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # A weekly rebuild verifies data drift without producing daily no-op deploys.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: chinatea-house-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install deterministic build dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Create canonical data snapshot
        run: |
          python -m execution.cli init
          python -m execution.cli seed
          python -m execution.cli comparisons
          python -m execution.cli validate

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build clean publication snapshot
        run: python -m execution.cli build --full

      - name: Verify generated site contract
        run: python scripts/verify_build.py output

      - name: Create IndexNow key file
        run: python execution/promotion/indexnow.py --create-key output

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.33.1 pages deploy output/
          --project-name=chinatea-house
          --branch=main

      - name: Submit sitemap to IndexNow
        run: python execution/promotion/indexnow.py --submit output/sitemap.xml
        continue-on-error: true

      - name: Upload failed build snapshot
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-build-${{ github.run_id }}
          path: output/
          retention-days: 7

  notify:
    runs-on: ubuntu-latest
    needs: build-deploy
    if: failure()
    steps:
      - name: Summarize failure
        run: echo "Build or deployment failed; inspect the first failing contract above."
